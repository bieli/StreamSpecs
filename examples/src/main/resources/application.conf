# StreamSpecs engine config (domain-agnostic).
# Rule *logic* lives in your DataQualityValidator; this file only configures routing & windows.

stream-specs {
  simulation-mode = true
  default-send-to-dlq = true

  # Routing / metric keys keyed by rule names from DataQualityValidator.statelessRules
  rules {
    decode-failure {
      metric-key = "alerts.errors.decode_failure"
      send-to-dlq = true
    }
    temperature-bound {
      metric-key = "alerts.errors.temperature_bound"
      send-to-dlq = true
    }
    humidity-bound {
      metric-key = "alerts.warnings.humidity_bound"
      send-to-dlq = false
    }
    device-id-present {
      metric-key = "alerts.errors.device_id_present"
      send-to-dlq = true
    }
  }

  stateful-rules {
    heartbeat-check {
      metric-key = "alerts.stateful.data_loss_detected"
      max-idle-duration = 3s
    }

    rolling-average-check {
      metric-key = "alerts.stateful.low_rolling_average"
      metric-name = "temperature"
      window-size-events = 3
      min-allowed-average = 15.0
    }

    time-rolling-average-check {
      metric-key = "alerts.stateful.time_rolling_low_average"
      metric-name = "temperature"
      window-duration = 2s
      min-allowed-average = 10.0
      min-samples = 2
      use-event-timestamp = true
    }

    duplicate-id-check {
      metric-key = "alerts.stateful.duplicate_id"
      window-size-events = 50
      send-to-dlq = true
    }

    volume-spike-check {
      metric-key = "alerts.stateful.volume_spike"
      window-duration = 2s
      max-events-in-window = 20
    }

    metric-deviation-check {
      metric-key = "alerts.stateful.metric_spike"
      metric-name = "temperature"
      window-size-events = 5
      max-deviation-percent = 150.0
    }

    out-of-order-check {
      metric-key = "alerts.stateful.out_of_order"
      send-to-dlq = false
    }
  }

  kafka {
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    bootstrap-servers = "localhost:9092"
    group-id = "stream-specs-iot"
    client-id = "stream-specs-iot"
    auto-offset-reset = "earliest"
    topics {
      incoming = "incoming-sensors"
      valid = "valid-sensors"
      dlq = "sensors-dlq"
    }
  }

  metrics {
    backend = "prometheus"
    backend = ${?STREAMSPECS_METRICS_BACKEND}
    echo-to-console = true
    prometheus {
      enabled = true
      enabled = ${?STREAMSPECS_METRICS_SERVER}
      host = "0.0.0.0"
      host = ${?STREAMSPECS_METRICS_HOST}
      port = 9464
      port = ${?STREAMSPECS_METRICS_PORT}
      jvm-metrics = true
    }
  }
}
