# StreamSpecs - declarative real-time data quality rules (HOCON)
#
# Each rule under `rules` maps an error code to:
#   - metric-key  : counter name for monitoring / Prometheus
#   - send-to-dlq : true  -> route event to Dead Letter Queue
#                   false -> pass event downstream but still emit the metric

stream-validator {

  # true  = local demo without a Kafka broker
  # false = connect to kafka.bootstrap-servers
  simulation-mode = true

  rules {
    missing-id {
      metric-key = "alerts.errors.missing_id"
      send-to-dlq = true
    }

    negative-price {
      metric-key = "alerts.errors.negative_price"
      send-to-dlq = true
    }

    invalid-email-format {
      metric-key = "alerts.warnings.invalid_email"
      send-to-dlq = false
    }

    json-parse-failure {
      metric-key = "alerts.errors.json_parse"
      send-to-dlq = true
    }
  }

  # Extra stateless DQ checks
  stateless-extras {
    freshness-check {
      metric-key = "alerts.warnings.stale_event"
      max-lag = 5m
      send-to-dlq = false
    }

    # Default: ISO 4217 alphabetic codes (banking / insurance), e.g. PLN, EUR, USD
    iso-4217-currency-check {
      enabled = true
      metric-key = "alerts.errors.invalid_iso4217_currency"
      send-to-dlq = true
      require-field = false   # validate only when currency is present
    }

    # Optional: further restrict to a product allow-list (must still be ISO 4217)
    allowed-currency-check {
      metric-key = "alerts.errors.invalid_currency"
      allowed = ["PLN", "EUR", "USD"]
      send-to-dlq = true
    }
  }

  stateful-rules {
    # Too quiet
    heartbeat-check {
      metric-key = "alerts.stateful.data_loss_detected"
      max-idle-duration = 3s
    }

    # Mean of last N prices too low (count-based)
    rolling-price-check {
      metric-key = "alerts.stateful.low_rolling_average"
      field = "price"
      window-size-events = 3
      min-allowed-average = 50.0
    }

    # Mean of prices inside a sliding time window (event-time when present)
    time-rolling-price-check {
      metric-key = "alerts.stateful.time_rolling_low_average"
      field = "price"
      window-duration = 2s
      min-allowed-average = 50.0
      min-samples = 2
      use-event-timestamp = true
    }

    # Kafka at-least-once / producer retries
    duplicate-id-check {
      metric-key = "alerts.stateful.duplicate_id"
      window-size-events = 50
      send-to-dlq = true
    }

    # Too loud (flood / burst)
    volume-spike-check {
      metric-key = "alerts.stateful.volume_spike"
      window-duration = 2s
      max-events-in-window = 20
    }

    # Sudden price jump vs rolling baseline (e.g. +200%)
    price-deviation-check {
      metric-key = "alerts.stateful.price_spike"
      window-size-events = 5
      max-deviation-percent = 150.0
    }

    # Event timestamps going backwards
    out-of-order-check {
      metric-key = "alerts.stateful.out_of_order"
      send-to-dlq = false
    }
  }

  kafka {
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    bootstrap-servers = "localhost:9092"
    group-id = "stream-specs-validator"
    client-id = "stream-specs"
    auto-offset-reset = "earliest"

    topics {
      incoming = "incoming-orders"
      valid = "valid-orders"
      dlq = "orders-dlq"
    }
  }

  metrics {
    # console | silent | prometheus
    # Override: STREAMSPECS_METRICS_BACKEND or --metrics-backend
    backend = "prometheus"
    backend = ${?STREAMSPECS_METRICS_BACKEND}
    echo-to-console = true

    prometheus {
      # HTTP scrape server (/metrics). Override:
      #   STREAMSPECS_METRICS_SERVER=true|false
      #   --metrics-server / --no-metrics-server
      enabled = true
      enabled = ${?STREAMSPECS_METRICS_SERVER}

      host = "0.0.0.0"
      host = ${?STREAMSPECS_METRICS_HOST}

      port = 9464
      port = ${?STREAMSPECS_METRICS_PORT}

      jvm-metrics = true
    }
  }
}
